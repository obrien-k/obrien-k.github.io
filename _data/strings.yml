# Strings
# =======================================================================================
# This file contains all soft-coded strings of the theme.
# You can edit them here if you want to change the wording of certain phrases,
# e.g. maybe you prefer "Fetching…" to "Loading…", etc.
#
# You can also use this to "translate" the theme into different langauges,
# but note that this may not work in all situations,
# especially for languages that differ significantly from English.

# Free version
# ---------------------------------------------------------------------------------------
home:                  Home
pages:                 Pages
posts:                 Posts
about:                 About
related_posts:         Related Posts
other_projects:        Other Projects
comments:              Comments
jump_to:               Jump to
navigation:            Navigation
social:                Social
links:                 Links
links_icon:            'icon-link'
pagination:            Pagination
newer:                 Newer
older:                 Older
forward:               Forward
back:                  Back
permalink:             Permalink
permalink_icon:        'content-hash'
templates:             Templates (for web app)
present:               present
toc:                   Table of Contents
note:                  Note
description:           Description
search:
  label:               Search
  placeholder:         Search posts…
  no_results:          No posts match.

newsletter:
  title:               Get new posts by email
  prompt:              No spam, unsubscribe whenever.
  email_placeholder:   you@example.com
  submit:              Subscribe

random:                Random post

loading:               Loading…
redirecting:           Redirecting…

continue_reading:      >
  Continue reading <!--post_title-->

cookies_banner:
  text:                >
    This site uses cookies. [Cookies Policy](/cookies-policy/).
  okay:                Okay

not_found:
  title:               '404'
  message:             |
    This page doesn't exist, or it did before the world moved on.
    <!--home_link-->.
  home_link:           Return to the index

offline:
  title:               'Offline'
  message:             |
    You're offline and this page isn't cached.
    <!--home_link--> when connectivity returns.
  home_link:           Try the index

error:
  title:               Error
  message:             |
    Something broke while loading <!--link-->.

# Separators
# ---------------------------------------------------------------------------------------
posted:                'Posted'
last_modified_at:      'Last modified at'
last_modified_at_icon: 'icon-history'
colon:                 ':'
separator:             '|'
category_start:        'in '
category_spearator:    ' / '
tag_start:             'on '
tag_separator:         ', '
from_to_separator:     '–'
breadcrumbs_home:      'home'
breadcrumbs_separator: '/'

# Date formats
# ---------------------------------------------------------------------------------------
date_formats:
  post:                '%d %b %Y'
  last_modified_at:    '%Y-%m-%d'
  related_post:        '%d %b %Y'
  list_group_by:       '%Y'
  list_entry:          '%d %b'
  project:             '%Y'
  projects_group_by:   '%Y'
  resume:              '%b %Y'


