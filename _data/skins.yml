# Skin registry — _data/skins.yml
#
# Three skins, two built-in SCSS overlays (_sass/skins/_frutiger-aqua.scss +
# _vaporwave.scss, toggled via the body.skin-<id> class) and one CSS-injection
# override (Anorex). See docs/architecture.md "Modularization" (WS-F).
#
# Fields:
#   id:      unique key; also used by the cycle button to identify state
#   label:   display name
#   short:   2-char abbreviation shown on the nav cycle button
#   hue:     signature color — tints the active glyph + this skin's cycle dot
#   desc:    one-liner for tooltip / docs
#   css:     path or CDN URL to override stylesheet; null = built-in
#   dark:    true = activates body.dark-mode; false = removes it; null = leave as-is
#   default: true on exactly ONE skin = the skin shown when nothing is saved
#            (the WS-F one-line default switch — pairs with the matching @import
#            in _sass/my-style.scss). Drop it everywhere to fall through to base.
#
# CSS-injection skins (css != null) are ejectable: swap the href to a CDN URL
# in `css` and the site pulls changes at runtime, no rebuild needed.

- id: vaporwave
  label: VaporWave
  short: VW
  hue: "#e100ff"
  desc: "Original skin — neon magenta/cyan, 8-bit flat panels"
  css: null
  dark: true

- id: frutiger-aqua
  label: Frutiger Aqua
  short: FA
  hue: "#0099cc"
  desc: "32-bit glass / Aero — Vista-era sky and gloss panels"
  css: null
  dark: false
  default: true   # shown when no skin is saved (its unscoped body{} sets the default tokens)

- id: anorex
  label: Anorex
  short: AX
  hue: "#a56a22"
  desc: "Skeuomorphic wood / parchment — ported from Gazelle/WhatCD (WIP)"
  css: /assets/css/skins/anorex.css
  dark: null
