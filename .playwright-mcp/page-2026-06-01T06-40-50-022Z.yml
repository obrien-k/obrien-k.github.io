        - blockquote [ref=e317]:
          - paragraph [ref=e318]: There are two private trackers that are considered the most direct descendants of What.CD, both of which were used to find participants. Additionally, the website reddit has a “subreddit” (a specific community within the larger site) devoted to BitTorrent trackers, located at reddit.com/r/trackers. Lastly, a private subreddit for former What.CD members, located at reddit.com/r/whatnextcd, was also used for recruitment. Survey responses were collected using SurveyMonkey. 120 individuals provided responses, and no identifying information was collected.
        - 'heading "200,000 Maximum Users Permalink #" [level=2] [ref=e319]':
