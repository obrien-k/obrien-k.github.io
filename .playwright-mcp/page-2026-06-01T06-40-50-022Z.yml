        - blockquote [ref=e162]:
          - paragraph [ref=e163]: Some user classes, mostly secondary ones, were specialized and created an official space for users who wanted to share their own music (“Artist”), elite visitors from other private trackers (“Torrent Celebrity”), or those who maintain the site (“Delta Team,” “Build Team,” and “Alpha Team”). In connection with Feenberg’s discussion of class dynamics in technological systems, we see a contradiction between the predicted egalitarianism of technological alternatives and possibly autocratic tendencies of What.CD.
          - paragraph [ref=e164]: “Do not PM, DCC, or Query anyone you don’t know or have never talked to without asking first; this applies specifically to staff” (What.CD)
        - paragraph [ref=e165]:
          - text: —
