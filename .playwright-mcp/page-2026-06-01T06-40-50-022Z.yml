        - paragraph [ref=e308]: The most common groups were Power User and Elite, with 46 and 36 members, respectively. Approximately half of each joined through interview and invite, which indicates that the joining method most likely did not have any correlation with a certain amount of site activity. Thus, the hypothesis that members that interviewed may have felt more of a sense of ownership because of the increased labor required is proven to be inaccurate. However, it is interesting to note that most users were adequately active to become Power Users, which required uploading at least five torrents, a feat that would have proven especially difficult toward the end of the site’s existence, since fewer holes existed in a comprehensive music library. Of the users that remained Users, six joined through interviews and three joined through invites, the opposite is true for Members, one class below Users.
        - paragraph [ref=e309]: The one survey participant who claimed Developer status was a member for 6-8 years, an unsurprising amount of time for someone who may have felt more a sense of ownership than other member classes.
