        - blockquote [ref=e364]:
          - paragraph [ref=e365]: "Question 5 of the survey interrogated notions of culture on What.CD: “How would you describe the importance of What.CD to you personally and from a broader cultural perspective. So, for example, would you say the site was important beyond its utility to you?” The responses from participants range from indicating major cultural importance to very little. On another axis, the responses reflect opinions about levels of use, in which some users were incredibly active, and others were only active to the extent that their ratio remained healthy or their musical needs were met. There is not any evidence that the two axes correlate, so it is entirely possible that users that were on What.CD daily did not think of it as a culturally valuable site. Conversely, some users could have used the site infrequently yet felt that it was culturally significant."
        - blockquote [ref=e366]:
          - paragraph [ref=e367]: At nearly 10% of the overall word usage, the site’s utility was most closely linked to its ability to store information in a useful configuration. Often, the decentralized structure of a private tracker was referenced as the reason for its success as an archive. One user wrote that “the loss of the metadata was the big loss to me. Communities come and go. The release of the data partially filled that gap.” This data was the result of the What.CD collective uploading and subsequently curating such a huge trove of information, much of which the previous chapter used as its impetus.
        - blockquote [ref=e368]:
          - paragraph [ref=e369]: Before I would just listen and download from YouTube, after w.cd I actually started to value quality, bought high end headphones, bought CD’s, not only to upload them to the tracker, but also to just to build a music collection outside of my HDDs. Basically it took my music ‘taste’ to a whole other level. I think it also made me appreciate other art forms a lot more than before. And I’m afraid it released my inner datahoarder. I felt genuinely sad when it went offline. That’s when, for the first time, I felt its effect on my life had far exceeded its immediate utility.
        - paragraph [ref=e370]: "Another user:"
        - blockquote [ref=e371]:
          - paragraph [ref=e372]: I actively purchase merch (mostly new vinyl) from artists I truly enjoy, and without What.cd my vinyl collection would probably be 25% of what it is. It’s my opinion that others acted as myself, so that in a broader sense this was the most valuable impact of What.cd to the music world. I can say with certainty that through What.cd I exposed friends not on What to great new music that they would otherwise never have known of as well. To summarize, I believe the importance was a level playing field of exposure for artists. I won’t deny that the pirating aspect was a big contributor to its effectiveness though.
        - blockquote [ref=e373]:
          - paragraph [ref=e374]: It was like a big library for me. I actually work in classical music, and it was incredibly useful to have everything I needed available at a couple of mouse clicks. Yes, because of the effort put into curating the material, I think it was an important worldwide resource.
        - paragraph [ref=e375]: "A third:"
        - blockquote [ref=e376]:
          - paragraph [ref=e377]: From a broader cultural perspective, What.CD was pretty much the only place to find some rare releases that would otherwise be forgotten. Incredible works of art should be preserved and therefore What.CD was of great importance.
        - blockquote [ref=e378]:
          - paragraph [ref=e379]:
            - text: One of the groups that I liked, at the time, had a few releases. But, one of the What.CD members was friends with the group. He uploaded stuff from them (probably against What’s rules). That was impossible to get
            - emphasis [ref=e380]: anywhere
            - text: else. Furthermore, there was a supergroup that released one album. The album stopped being produced. Being in the States and the group being in Europe it was impossible to obtain (and I’m willing to buy stuff and get it imported), literally impossible. But, on What.CD the FLAC’s were available.
        - blockquote [ref=e381]:
          - paragraph [ref=e382]: I spent nearly 25% of my life downloading music from What. It helped open my eyes to new genres of music and helped me discover acts to which I never would have been exposed if not for What. I went to shows based on recommendations from people on the forums and met some incredible people (musicians, fans, booking agents, tour managers, etc.) at those shows. What is without a doubt the most important website I have been able to utilize over the course of my life. As a 31-year old who has grown up with the internet, I think that is a testament to how important it was to me.
        - blockquote [ref=e383]:
          - paragraph [ref=e384]: What.cd was by far the most influential thing in my life on music consumption. I listened to/found far more through it than I ever did through anything before or could have otherwise. It was the greatest music database ever accumulated, and on top of the music itself had more and more reliable data on music (album covers, different releases, metadata) than any other site ever.
        - paragraph [ref=e385]:
          - link [ref=e386] [cursor=pointer]:
            - /url: /assets/img/blog/posts/stellar/genre-word-cloud.jpg
          - emphasis [ref=e387]: pp. 134
          - text: "— Figure 17: Word Cloud for Question 7"
        - blockquote [ref=e388]:
          - paragraph [ref=e389]: However, words like “lossless”, “unreleased,” “obscure,” and “anything” suggest that stylistic parameters did not drive the search and download habits of all What.CD members.
