        - blockquote [ref=e167]:
          - paragraph [ref=e168]: "The interview itself took place over IRC at the channel #What.CD-invites, and often required waiting 1-2 hours (or even longer) in a queue before a member of the interviewing team could get to the prospective member. Additionally, the prospective member had to have a certain minimum connection speed to even qualify for an interview. The interview could be taken a total of three times before ultimate failure was declared, at which point the only chance at membership was an invite from the appropriate member class."
          - paragraph [ref=e169]: The platform on which What.CD operated was an open source content management system called Gazelle. Gazelle began development when the site was first launched in October of 2007 and was considered to have reached a level of maturity indicated by its documentation, bug fixes, and coding standardization. It was maintained by What.CD administrators, and is used by many other private trackers. Its architecture also follows many of the conventions and logics stemming from What.CD, including torrent and user organization, facilitating forums, and creating user interfaces. For example, the following rules were taken from Project Gazelle’s “Coding Standards:”
          - list [ref=e170]:
            - listitem [ref=e171]: All button labels shall use sentence case.
            - listitem [ref=e172]: All table headings shall use sentence case.
