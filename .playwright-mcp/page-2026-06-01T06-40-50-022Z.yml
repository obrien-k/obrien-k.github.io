        - paragraph [ref=e113]:
          - text: "Figure 4: An example of torrent comments, from the page for the video game Fallout 4’s Soundtrack by Inon Zur —"
          - emphasis [ref=e114]: pp. 44
        - blockquote [ref=e115]:
          - paragraph [ref=e116]: "[…] as Figure 4 demonstrates, requests for seeds or notification that a user is seeding. In addition to building rapport, notifying viewers of comments that I am seeding signifies that (1) I care about this artist or album or (2) I care about my status on the site and about maintaining a certain ratio. In either case, the discussion that ensues, just like most of the discussion in the forums and on IRC channels, serves an ancillary role to the main technosocial apparatus on the site, the torrents themselves."
        - blockquote [ref=e117]:
          - paragraph [ref=e118]: "The following rules were especially prescriptive:"
          - list [ref=e119]:
            - listitem [ref=e120]: Don’t use all capital letters, excessive !!! (exclamation marks) or ??? (question marks). It seems like you’re shouting!
            - listitem [ref=e121]: No posting music requests in forums. There’s a request link at the top of the page; please use that instead.
            - listitem [ref=e122]: Don’t point out or attack other members’ share ratios. A higher ratio does not make you better than someone else.
            - listitem [ref=e123]: No political or religious discussions. These types of discussions lead to arguments and flaming users, something that will not be tolerated. The only exception to this rule is The Library forum, which exists solely for the purpose of intellectual discussion and civilized debate.
            - listitem [ref=e124]: No language other than English is permitted in the forums. If we can’t understand it, we can’t moderate it.
            - listitem [ref=e125]: Try not to ask stupid questions. A stupid question is one that you could have found the answer to yourself with a little research, or one that you’re asking in the wrong place. (What.CD)
          - paragraph [ref=e126]: The Laboratory was where code-minded users discussed various tweaks to the website and tools that were built to augment the utility of What.CD, such as the Android and iPhone apps, custom stylesheets, and other data manipulation and monitoring tools.
          - paragraph [ref=e127]: The Lab represented the unique constellation of interests and communicative strategies that set What.CD apart from other online music communities.
          - paragraph [ref=e128]: Some of the most popular threads, according to age and number of posts, were entitled “The ‘What album should I start with?’ Thread,” “Judge others by their recently snatched,” […] The novel affordance here, though, lies in the distinctly musical and collector status that the site attracts. In other words, it was not common to find users that feel tepid about their membership at What.CD; enthusiasm and participation could be parlayed into higher ratios that contribute to the internal logic by which What.CD operated.
