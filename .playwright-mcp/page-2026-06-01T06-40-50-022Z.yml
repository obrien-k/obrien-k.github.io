        - paragraph [ref=e336]:
          - emphasis [ref=e337]: pp. 129–135
          - text: "— The mechanics of What.CD often attracted the attention of network specialists. One participant wrote that the utility of the site was impressive:"
        - blockquote [ref=e338]:
          - paragraph [ref=e339]: Gazelle, the backend code made for What.cd, is still used on lots of trackers. Many of their rules have been adopted by other trackers. They made a huge difference to the private tracker community, but I wouldn’t say it goes farther than that.
        - paragraph [ref=e340]: While acknowledging the successes of Gazelle, this individual limits the scope of its impact to the closed world of private trackers, a sentiment rarely articulated elsewhere in the survey results. They are correct, though, that the development and implementation of such a tool has little utility outside of the technosocial sphere of a private tracker like What.CD.
        - blockquote [ref=e341]:
          - paragraph [ref=e342]: "Additionally, one participant even attributed his coding skills to the site: “I would never have become the programmer I am today if it wasn’t for the hours spent working on What.cd.”"
        - blockquote [ref=e343]:
          - paragraph [ref=e344]: "What.CD’s utility was tied to its “community” values, which underlines the findings related to how generally useful the site was. Online communities are generally difficult to define, as they are amorphous, transient, have blurry boundaries, and are often more contested for their community status than a city or a mosque. Nonetheless, What.CD was clearly interpreted as a vibrant community by the respondents to this survey. Question 5’s responses were manually coded in a cascading manner, in which the first filter was whether or not the site was useful. The following frequency table was generated:"
        - table [ref=e345]:
          - rowgroup [ref=e346]:
            - row "Was What.CD Useful? Frequency Percent" [ref=e347]:
