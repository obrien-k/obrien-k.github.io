        - blockquote [ref=e323]:
          - paragraph [ref=e324]: Gazelle, the software that handled load balancing and databases (backend management), only allowed for a maximum of 200,000 users.
        - blockquote [ref=e325]:
          - paragraph [ref=e326]: Gazelle’s designers maintained both a sense of a closed, elitist community and a user base size that would ensure adequate torrent seeding. Similarly, the process of becoming a member, either through an invite or an interview, was designed to only let certain people in and simultaneously create a sense of community.
        - paragraph [ref=e327]:
          - link [ref=e328] [cursor=pointer]:
