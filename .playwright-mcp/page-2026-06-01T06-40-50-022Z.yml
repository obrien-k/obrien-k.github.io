        - blockquote [ref=e181]:
          - paragraph [ref=e182]: Control in networks must aim for an effectiveness that is immanent to the network, in the sense that the most perfectly controlled network is one that controls or regulates itself … The network itself must be articulated as an object of design, implementation, and regulation. Control in this sense does not pervades the network but operates over it; control in this sense is topsight and oversight. (p. 36)
        - blockquote [ref=e183]:
          - paragraph [ref=e184]: By maintaining Gazelle, What.CD indirectly controlled other sites, even though they fall outside the bounds of What.CD’s native network. As some informal discourse suggests (not to mention the fact that “celebrities” from other trackers have a special status on What.CD), the relationships between private trackers can be characterized as achieving solidarity, which is, on the one hand, egalitarian, but as the authors above indicate, can also suggest relationships of power.
