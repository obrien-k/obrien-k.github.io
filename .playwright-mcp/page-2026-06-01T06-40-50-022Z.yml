        - paragraph [ref=e42]:
          - text: Firstly, this isn’t anything novel. In fact,
          - link "its documented widely" [ref=e43] [cursor=pointer]:
            - /url: https://scispace.com/pdf/what-cd-a-legacy-of-sharing-sj3ll3tjy8.pdf
          - text: —
          - link "Archive.org" [ref=e44] [cursor=pointer]:
            - /url: https://web.archive.org/web/20251208001041/https://scispace.com/pdf/what-cd-a-legacy-of-sharing-sj3ll3tjy8.pdf
          - text: .
        - paragraph [ref=e45]:
          - link "whatinterviewprep.com" [ref=e46] [cursor=pointer]:
            - /url: https://whatinterviewprep.com
        - blockquote [ref=e47]:
          - paragraph [ref=e48]: This system has been in near-constant operation for over 7 years. Thanks to the tireless efforts of the Interview Team (whose members come from all over the world), What.CD entrance interviews are conducted 24 hours a day, and in several different languages. Although some fail, hundreds of users pass the interview every month. Bit by bit, the number of interviews conducted by our team grows. Last year we celebrated the 50,000th interview, and we now have the honor of announcing that over 25,000 What.CD members have successfully earned their invitation by passing the interview.
        - paragraph [ref=e49]:
          - text: —
          - emphasis [ref=e50]: pp. 36
        - paragraph [ref=e51]:
          - link [ref=e52] [cursor=pointer]:
            - /url: /assets/img/blog/posts/stellar/gazelle-model.png
          - emphasis [ref=e53]: pp. 36
          - text: — However, these were not the only rules that had to be followed. Although there were only 6 major top line “golden” rules (each with many parts), those did not account for the rules governing naming conventions, best practices, creating torrents, chatting on What.CD’s IRC network, or how to tag torrents. Although breaking some rules could simply result in a reprimand, others could ban a user from the site, either temporarily or permanently.
        - paragraph [ref=e54]:
          - link [ref=e55] [cursor=pointer]:
            - /url: /assets/img/blog/posts/stellar/torrent-upload.jpg
          - emphasis [ref=e56]: pp. 39
          - text: — But where would users find new works? The site’s documentation suggested going to the dollar store, the library, borrowing CDs from friends, visiting newsgroups, and going to Bandcamp to download free albums. It was especially difficult to find content that has not been uploaded, though. For instance, there were approximately 200 different versions of Pink Floyd’s Dark Side of the Moon alone. This includes every possible format, release, and remaster, and such availability is not an anomaly. Additionally, each version had MP3s at 320kbps, two different variable bit-rate MP3 possibilities, and a FLAC (lossless) download.
        - blockquote [ref=e57]:
          - paragraph [ref=e58]: "Bruno Latour, as a seminal thinker within Science and Technology Studies (STS), played a role in shaping it as a multidisciplinary field that coalesced in the 1970s and 80s, even though many of its precursory bodies of literature were developed much earlier in the 20th century. Although its entire set of goals cannot be discussed here, a few important contributions that connect with a discussion of What.CD can be teased out of Latour’s foundational volumes Science in Action: How to Follow Scientists and Engineers through Society (1987) and Reassembling the Social (2005). The goal of integrating these ideas into the current topic is to deconstruct the seemingly holistic object of a technological fact to uncover its motivations and internal logics. Taking a different methodological approach from Marcuse and Feenberg, STS seeks to deconstruct technology rather than culturally situate it."
        - paragraph [ref=e59]:
          - text: —
          - emphasis [ref=e60]: pp. 31
        - blockquote [ref=e61]:
          - paragraph [ref=e62]: Latour emphasizes that much of the contingency is invested in relationships between different individuals or classes of people like scientists, or in this specific case, What.CD members. He writes that “the instrument, whatever its nature, is what leads you from the paper to what supports the paper, from the many resources mobilized in the text to the many more resources mobilized to create the visual displays of the texts” (1987, p. 69). Within such a framework, there are several possibilities for a unit of analysis within What.CD, all of which are discussed below.
        - paragraph [ref=e63]:
          - text: —
          - emphasis [ref=e64]: pp. 32
        - blockquote [ref=e65]:
          - paragraph [ref=e66]: "While a broader motivation might be to create the most robust musical library in human history, the political economy of a high ratio on What.CD allowed for a user to climb the ranks of user classes, as well as be seen in a better light on the site (anyone’s ratio, as well as the amount they have up and downloaded, was publicly viewable, see Figure 3). Put more simply: users keep uploading either because it is a marker of status or because they want to keep downloading, and they download as an affordance of how much they have uploaded. Such a community organizational mechanism like uploading can be considered, at least currently, one that bypasses commercial models for internet development, and as a result, has the potential to contribute to new models. Feenberg writes that “any technology that offers new possibilities for the formation of community is thus democratically significant” (2009, p. 81)."
        - paragraph [ref=e67]:
          - text: —
          - emphasis [ref=e68]: pp. 38
        - blockquote [ref=e69]:
          - paragraph [ref=e70]: Finding content that might interest a user could either be done through searching for specific torrents (a search bar was static at the top of any page, see Figure 1), finding out what other users have downloaded, or seeing what had been uploaded most recently. By clicking on a torrent after using one of these query methods, a user could see the artist, album, label, genre, album artwork, original uploader, track list, a URL for more information (such as a Bandcamp page or the artist’s website), to which collages the work belongs, and in which formats the work is available. Concerning private trackers, Chen, Chu and Li (2011) write that “because there are too many seeders in PTs [private trackers] … members can hardly … increase their share ratios. This phenomenon forces most members to seed for a long time to survive … Obviously, this vicious circle can benefit members who are downloading, but it does harm to members who want to upload” (p. 1). In their computational estimation of the problem, the authors hypothesize that an optimal seed-to-leech ratio will provide for the best environment, in which both downloaders are encouraged to keep downloading and uploaders continue to find new material.
        - paragraph [ref=e71]:
          - text: —
          - emphasis [ref=e72]: pp. 40, 41
        - blockquote [ref=e73]:
          - paragraph [ref=e74]: So, if someone offers 30 gigabytes for a vinyl release of Bad Brains’ 1989 release Quickness as a lossless FLAC, the uploader would be obliged to follow the very strict rules concerning audio quality and naming conventions, and then claim the request as filled, at which point that user would have the bounty added to their ratio. If something about the upload was problematic because it has not followed all the rules, then the requester or a moderator can “unfill” the request, an action that can have dire consequences for the uploader. Such consequences include being banned from the site or being demoted to an inferior user class.
        - paragraph [ref=e75]:
          - text: —
          - emphasis [ref=e76]: pp. 40
        - blockquote [ref=e77]:
          - paragraph [ref=e78]: "Freeleech: Users can download the torrent without it affecting their ratio, except that it will increase the amount that is uploaded. New users are encouraged to utilize freeleeches to increase their ratio."
          - paragraph [ref=e79]: "Neutral Leech: Users can download the torrent without affecting their ratio, but, unlike freeleech torrents, the amount uploaded will also not affect the user’s ratio."
          - paragraph [ref=e80]: "Normal Downloads: When users download or upload torrent data, it is reflected in their ratio in terms of gigabytes."
        - paragraph [ref=e81]:
          - text: —
          - emphasis [ref=e82]: pp. 41
        - blockquote [ref=e83]:
          - paragraph [ref=e84]: "Your required ratio depends on several things:"
          - list [ref=e85]:
            - listitem [ref=e86]: How long you have been on the site.
            - listitem [ref=e87]: Your downloaded amount.
            - listitem [ref=e88]: How many torrents you are seeding.
            - listitem [ref=e89]: How long you have been seeding them over the past 7 days.
            - listitem [ref=e90]: Is your download ability disabled? (What.CD)
        - paragraph [ref=e91]:
          - text: —
          - emphasis [ref=e92]: pp. 41
        - blockquote [ref=e93]:
          - paragraph [ref=e94]:
            - text: Additionally, the wiki described the basic ratio formula as “maximum required ratio multiplied by 1 –
            - img "seeding/snatched" [ref=e95]
            - text: ” (What.CD). So, a user’s ratio was not as simple as
            - img "uploaded/downloaded" [ref=e96]
            - text: ", but rather took other social parameters into consideration that suggest certain cultural values. These include a user’s length of time on the site making them more valuable than new members, which signified the importance of continuity within the community. Also, the number of torrents a user was currently seeding and the length for which they had seeded played a part in their ratio, which also emphasizes the value in being reliable with the material that a user has downloaded so that it is available into perpetuity. The site’s wiki explicitly stated that torrents are calculated as being effectively seeded if they have been available for at least 72 hours in the past seven days. Lastly, and perhaps most obviously, unproductive members of the community, that is, those whose ability to download content has been disabled were also less likely to have a socially acceptable ratio."
          - paragraph [ref=e97]: So, although numbers are certainly important, in each torrent a user decided to upload or download, a statement was made regarding musical taste, political sensibilities, and other community values.
        - paragraph [ref=e98]:
          - text: —
          - emphasis [ref=e99]: pp. 42
        - blockquote [ref=e100]:
          - paragraph [ref=e101]: "[…] the following modes of communication are important to what Sanjay Sharma (2013) calls the “technocultural assemblage” of a platform (p. 48), which is the constitutive effect of tools like GUIs and algorithms combined with the communicative practices of a group of users. For What.CD, torrent comments, forums, and IRC channels created possibilities for discourse about the music, the site itself, and other matters. Just like nearly every other part of the site, a set of explicit rules governed allowable behavior within these discursive spaces."
