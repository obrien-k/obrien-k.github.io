server {
listen 80;
server_name wordpress.whatco.de;
return 301 https://$host$request_uri;
}

server {
listen 443 ssl;
server_name wordpress.whatco.de;



ssl_certificate /etc/letsencrypt/live/whatco.de-0001/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/whatco.de-0001/privkey.pem;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";

location / {
proxy_set_header    Host            http_host;
proxy_set_header    Forwarded       $proxy_add_forwarded;
proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_redirect off;
client_max_body_size 0;
proxy_pass http://what-code-ghost/;
}
}

server {
listen 80;
server_name wordpress.whatco.de;
return 301 https://$host$request_uri;
}

server {
listen 443 ssl;
server_name wordpress.whatco.de;

ssl_certificate /etc/letsencrypt/live/wordpress.whatco.de/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/wordpress.whatco.de/privkey.pem;

add_header Strict-Transport-Security "max-age=31536000;";

location / {
proxy_set_header    Host                $host;
proxy_set_header    Forwarded           $proxy_add_forwarded;
proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto   $scheme;
proxy_set_header    Accept-Encoding     "";
proxy_set_header    Proxy               "";
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_pass https://what-code-wordpress/;
proxy_redirect off;
}
}
