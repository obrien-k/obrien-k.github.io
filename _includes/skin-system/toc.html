<!-- Table of contents (WS-3). Free Hydejack's dynamic sidebar TOC is PRO-only,
     so this builds one from the article's headings: an inline <details> box by
     default, promoted to a fixed sticky sidebar when the right margin is wide
     enough (measured per-layout — Hydejack's docked sidebar shrinks the right
     margin at mid widths, so a fixed px breakpoint can't tell). The post
     description docks above it as a matching panel.
     `/* */` comments ONLY inside <script>: production compress_html collapses
     newlines, so a `//` would comment out the rest of the IIFE. -->
<script>
(function () {
  var ID = '_postToc';
  var DESC_DOCKED = 'post-toc-desc-docked';
  var DOCK_MIN_MARGIN = 264;  /* px of free right margin needed to dock */
  var TOP_CLEARANCE = 96;     /* px below viewport top where the TOC sticks (clears navbar) */
  var GAP = 16;               /* px between the description and TOC panels */

  /* Heading text minus Hydejack's injected `.permalink` anchor. */
  function labelOf(h) {
    var c = h.cloneNode(true);
    var p = c.querySelector('.permalink');
    if (p) p.remove();
    return c.textContent.trim();
  }

  function proseEl() {
    return document.querySelector('main.content article .content')
        || document.querySelector('article .content')
        || document.querySelector('main.content article')
        || document.querySelector('article');
  }

  /* Hydejack's "DESCRIPTION" label is a CSS :before keyed to
     `.page > header > .note-sm`, so the note is restyled in place, never moved
     in the DOM — moving it would drop the label. */
  function descEl() {
    var header = document.querySelector('main.content article header');
    return header && header.querySelector(':scope > p.note-sm');
  }

  /* Doc-coord Y the docked column aligns to: the cover image top, so the stack
     sits beside the header visual rather than level with the body text. The
     wrapper reserves its height via aspect-ratio, so this is stable before the
     image loads. Falls back to the header top when there's no cover. */
  function columnAnchor() {
    var el = document.querySelector('main.content article header .img-wrapper')
          || document.querySelector('main.content article header');
    return el ? Math.round(el.getBoundingClientRect().top + window.scrollY) : TOP_CLEARANCE;
  }

  /* Tracks scroll but is never clamped, so it scrolls off the top with the page
     rather than sticking like the TOC. */
  function applyDescScroll(desc) {
    if (desc && desc.classList.contains(DESC_DOCKED))
      desc.style.top = Math.round(desc._docTop - window.scrollY) + 'px';
  }

  function dockDescription(desc, left, anchor) {
    if (!desc) return null;
    desc.classList.add(DESC_DOCKED);
    /* Neutralize Hydejack's "third column" float inline. At >=104em its
       `.page > header > .lead + .note-sm { position:absolute; right:-25rem;
       width:21rem; bottom:0 }` (specificity 0,4,2) outranks the docked class
       and would fling the panel off-screen and stretch it to full height.
       Inline wins; these mirror the docked TOC's fixed 232px panel. */
    desc.style.position = 'fixed';
    desc.style.width = '232px';
    desc.style.right = desc.style.bottom = 'auto';
    desc._docTop = anchor;
    desc.style.left = left + 'px';
    applyDescScroll(desc);
    return anchor + desc.offsetHeight + GAP;
  }

  function undockDescription(desc) {
    if (!desc || !desc.classList.contains(DESC_DOCKED)) return;
    desc.classList.remove(DESC_DOCKED);
    desc.style.position = desc.style.width = desc.style.right =
      desc.style.bottom = desc.style.top = desc.style.left = '';
  }

  function collect() {
    var prose = proseEl();
    if (!prose) return [];
    var out = [];
    var all = prose.querySelectorAll('h2, h3, h4');
    for (var i = 0; i < all.length; i++) {
      var h = all[i];
      var label = labelOf(h);
      /* Stop at the COLOPHON graffiti zone — not article structure. NFKD folds
         the mathematical-bold heading to ASCII and stripping non-letters drops
         the zalgo combining marks between glyphs, so the buried word matches. */
      var norm = label.normalize('NFKD').replace(/[^A-Za-z]/g, '');
      if (/COLOPHON/i.test(norm)) break;
      if (!h.id || !label || h.classList.contains('no_toc')) continue;
      var level = h.tagName === 'H4' ? 4 : (h.tagName === 'H3' ? 3 : 2);
      out.push({ id: h.id, label: label, level: level });
    }
    return out;
  }

  function applyStickyTop(toc) {
    if (!toc.classList.contains('is-docked')) return;
    var start = toc._startDoc || TOP_CLEARANCE;
    toc.style.top = Math.max(TOP_CLEARANCE, Math.round(start - window.scrollY)) + 'px';
  }

  /* Dock into the right margin when there's room, else inline + collapsible. */
  function layout(toc) {
    var pane = document.querySelector('main.content') || proseEl();
    if (!pane) return;
    var right = pane.getBoundingClientRect().right;
    var desc = descEl();
    if (window.innerWidth - right >= DOCK_MIN_MARGIN) {
      toc.classList.add('is-docked');
      toc.open = true;
      var left = Math.round(right + 24);
      toc.style.left = left + 'px';
      var anchor = columnAnchor();
      var descBottom = dockDescription(desc, left, anchor);
      toc._startDoc = descBottom !== null ? descBottom : anchor;
      applyStickyTop(toc);
    } else {
      undockDescription(desc);
      toc.classList.remove('is-docked');
      toc.style.left = toc.style.top = '';
    }
  }

  function build() {
    var old = document.getElementById(ID);
    if (old) {
      if (old._tocCleanup) old._tocCleanup();
      old.remove();
    }

    var heads = collect();
    if (heads.length < 3) return;

    var toc = document.createElement('details');
    toc.id = ID;
    toc.className = 'post-toc';

    var summary = document.createElement('summary');
    summary.className = 'post-toc-title';
    summary.textContent = 'Contents';
    toc.appendChild(summary);

    var ul = document.createElement('ul');
    heads.forEach(function (item) {
      var li = document.createElement('li');
      li.className = 'lvl-' + item.level;
      var a = document.createElement('a');
      a.href = '#' + item.id;
      a.textContent = item.label;
      a.className = 'no-mark';  /* opt out of .content link underline styling */
      a.setAttribute('data-toc-target', item.id);
      li.appendChild(a);
      ul.appendChild(li);
    });
    toc.appendChild(ul);

    /* Inline mode renders after the header; docked mode is fixed, so its DOM
       position is cosmetic. Headings are flat children, so anchor off <header>. */
    var article = document.querySelector('main.content article')
               || document.querySelector('article');
    var header = article && article.querySelector('header');
    if (header && header.parentElement === article) {
      header.insertAdjacentElement('afterend', toc);
    } else {
      article.insertBefore(toc, article.firstChild);
    }

    layout(toc);
    spy(heads, toc);
  }

  /* Current section = last heading whose top has crossed a line near the
     viewport top, so a clicked heading landing at the top reads as current. */
  function spy(heads, toc) {
    var links = {};
    toc.querySelectorAll('a').forEach(function (a) {
      links[a.getAttribute('data-toc-target')] = a;
    });
    var THRESHOLD = 140;
    var ticking = false;
    function update() {
      ticking = false;
      applyStickyTop(toc);
      applyDescScroll(descEl());
      var current = heads[0].id;
      for (var i = 0; i < heads.length; i++) {
        var el = document.getElementById(heads[i].id);
        if (el && el.getBoundingClientRect().top <= THRESHOLD) current = heads[i].id;
      }
      Object.keys(links).forEach(function (id) {
        links[id].classList.toggle('active', id === current);
      });
    }
    function onScroll() {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }
    function onResize() {
      layout(toc);
      onScroll();
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onResize, { passive: true });
    update();
    toc._tocCleanup = function () {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onResize);
      undockDescription(descEl());
    };
  }

  if (document.readyState !== 'loading') build();
  else document.addEventListener('DOMContentLoaded', build);

  var ps = document.getElementById('_pushState');
  if (ps) ps.addEventListener('hy-push-state-after', build);
})();
</script>
